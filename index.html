<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>Допомога і Захист — превʼю для погодження</title>
<style>
:root{--cream:#f6f0e2;--black:#14120e;--gold:#b8893a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--black);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px;text-align:center}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 8px}
p.sub{margin:0 0 28px;color:#4a4436}
a.big{display:block;padding:20px 16px;margin:0 0 14px;background:var(--black);color:var(--cream);border:2px solid var(--gold);border-radius:10px;font-size:1.2rem;font-weight:600;text-decoration:none}
a.big:hover,a.big:focus{background:var(--gold);color:var(--black)}
.small{font-size:.95rem;margin:0 0 28px}
.small a{color:var(--black);text-decoration-color:var(--gold)}
.note{font-size:.85rem;color:#6b634f;margin:0}
</style>
</head>
<body>
<main>
<h1>Допомога і Захист</h1>
<p class="sub">Матеріали для погодження</p>
<a class="big" href="logo/logo-approval-mobile.png">Логотип (на погодження)</a>
<p class="small"><a href="logo/logo-approval.pdf">Завантажити PDF</a></p>
<a class="big" href="prototype/index.html">Прототип сайту</a>
